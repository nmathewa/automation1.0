name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ambviz:
    name: ambviz dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The display is a pinned dependency now; prove the pin still resolves
      # and installs, so a bad tag fails here rather than on the hub.
      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check
        run: ambviz --version

      # No firmware in this repository builds yet (see build-platformio.sh);
      # add a PlatformIO job back when gate_way_node or single_node does.
