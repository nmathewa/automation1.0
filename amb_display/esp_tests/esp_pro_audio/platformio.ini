; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Strip geometry and network settings are build flags, not source edits.
; WiFi credentials live in include/secrets.h (gitignored -- copy the .example).
;
;   pio run -e nodemcuv2 -t upload                       60 pixels, the default
;   PLATFORMIO_BUILD_FLAGS="-DLED_COUNT=108" pio run -e nodemcuv2 -t upload
;   pio run -e color_waves -t upload                     the demo, not the receiver
;
[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
lib_deps =
	makuna/NeoPixelBus@^2.7.6
; LED_COUNT  must match ambviz output.pixels
; LED_PIN     ESP8266 DMA output is fixed to GPIO3 (RX); the flag is for ESP32
; UDP_PORT    must match ambviz output.port
; MDNS_NAME   the strip answers to <name>.local, so no static IP anywhere
build_flags =
	-D LED_COUNT=60
	-D LED_PIN=3
	-D UDP_PORT=7777
	-D MDNS_NAME='"ambviz"'

[env:nodemcuv2]
board = nodemcuv2

[env:d1_mini]
board = d1_mini

; The standalone colour-wave demo in examples/. Not the audio receiver.
[env:color_waves]
board = nodemcuv2
lib_deps =
	fastled/FastLED@^3.6.0
build_src_filter = -<*> +<../examples/color_waves.cpp>
